name: 'Tests: node.js >= 20'

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'a tape file glob to narrow the suite; empty runs the whole suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [25, 23, 22, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2026-02-15T06%3A54%3A45.700000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      # `tests-only` is `nyc tape 'test/**/*.js'`, so a filter appended to it
      # would run the whole glob alongside the selection: branch instead, and
      # keep the unfiltered command exactly as upstream runs it.
      - name: 'run the test suite'
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx nyc tape "${{ inputs.test-filter }}"
          else
            npm run tests-only
          fi

  pack:
    name: 'npm pack'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # the published tarball was packed with node 25.5.0 / npm 11.8.0; pinning
      # the node patch pins that exact npm, and with it npm pack's member set.
      - uses: actions/setup-node@v4
        with:
          node-version: 25.5.0
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2026-02-15T06%3A54%3A45.700000Z@time-machines-npm.sealsecurity.io/'
      - run: npm install
      # `prepack` (npmignore + `npm run dist`) is what the published tarball is
      # built from, so `npm pack` runs with scripts enabled and `dist/qs.js` is
      # regenerated by browserify exactly as the release was.
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: qs-tarball
          path: qs-6.15.0.tgz
          if-no-files-found: error

  node:
    name: 'node >= 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
