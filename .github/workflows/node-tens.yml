name: 'Tests: node.js 10 - 20'

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'a tape file glob to narrow the suite; empty runs the whole suite'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  tests:
    name: 'node ${{ matrix.node-version }}'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [19, 18, 17, 16, 15, 14, 13, 12, 11, 10]
    steps:
      - uses: actions/checkout@v4
      # Dependencies install on Node 25: the bundled npm of some target nodes
      # (npm 6.7.0 on node 11) hangs on install; the target node only runs them.
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: 'pin the npm registry to the release date'
        run: npm config set registry 'https://:2026-02-15T06%3A54%3A45.700000Z@time-machines-npm.sealsecurity.io/'
      - name: 'install dependencies on node 25'
        run: npm install
      - name: 'run the test suite on the target node via nvm'
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

          nvm install "${{ matrix.node-version }}"
          nvm use "${{ matrix.node-version }}"
          node -v

          if [ -n "${{ inputs.test-filter }}" ]; then
            PATH="$PWD/node_modules/.bin:$PATH" nyc tape "${{ inputs.test-filter }}"
          else
            npm run tests-only
          fi

  node:
    name: 'node 10 - 20'
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: true
